name: documentor-ci

# The fork's gate for the `documentor` branch: upstream's typecheck and linux
# unit suite, on GitHub-hosted runners. Upstream's own `test` and `typecheck`
# workflows target `dev` and runner labels this fork does not have.
#
# The app's Playwright e2e suite is left out: it covers the web UI, which
# DocuMentor does not ship.

on:
  push:
    branches:
      - documentor
  pull_request:
    branches:
      - documentor
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: bun typecheck

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run unit tests
        timeout-minutes: 30
        run: GITHUB_ACTIONS=false bun turbo test

      - name: Check generated client
        working-directory: packages/client
        run: bun run check:generated

      - name: Run HttpApi exerciser gates
        working-directory: packages/opencode
        run: bun run test:httpapi
